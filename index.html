<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gradient Stock Generator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0b0d12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
}

.sidebar{
    width:330px;
    min-width:330px;
    background:#11151c;
    border-right:1px solid #252b35;
    padding:20px;
    overflow-y:auto;
}

.logo{
    font-size:21px;
    font-weight:700;
    margin-bottom:4px;
}

.sub{
    color:#8993a3;
    font-size:12px;
    margin-bottom:22px;
}

.section{
    margin-top:22px;
}

.section-title{
    font-size:11px;
    font-weight:700;
    color:#8e98a8;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:12px;
}

label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#cbd2dc;
    margin:11px 0 6px;
}

.value{
    color:#fff;
}

select,
input[type="number"]{
    width:100%;
    background:#1a2029;
    border:1px solid #303846;
    color:#fff;
    border-radius:7px;
    padding:9px;
    outline:none;
}

input[type="range"]{
    width:100%;
    accent-color:#7c8cff;
}

.colors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.colorBox{
    width:100%;
    height:40px;
    border:0;
    padding:0;
    border-radius:7px;
    background:transparent;
    cursor:pointer;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    color:#fff;
    background:#202733;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#2b3442;
}

.primary{
    width:100%;
    background:#5968ff;
}

.primary:hover{
    background:#6876ff;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.random{
    margin-top:12px;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:60px;
    border-bottom:1px solid #252b35;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.status{
    font-size:12px;
    color:#929baa;
}

.preview{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:#080a0e;
}

canvas{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    box-shadow:0 15px 60px rgba(0,0,0,.45);
}

.previewButtons{
    position:absolute;
    right:20px;
    bottom:20px;
    display:flex;
    gap:8px;
}

.bottom{
    height:55px;
    border-top:1px solid #252b35;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 18px;
}

.seedBox{
    width:130px;
}

.small{
    font-size:11px;
    color:#8e98a8;
}

@media(max-width:800px){
    .sidebar{
        width:270px;
        min-width:270px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">Gradient Stock Generator</div>
    <div class="sub">Procedural motion backgrounds</div>

    <div class="section">
        <div class="section-title">Style</div>

        <select id="style">
            <option value="liquid">Liquid Flow</option>
            <option value="silk">Silk Waves</option>
            <option value="aurora">Aurora</option>
            <option value="vortex">Vortex</option>
            <option value="ribbon">Fluid Ribbons</option>
            <option value="plasma">Plasma</option>
            <option value="organic">Organic Blobs</option>
            <option value="rings">Soft Rings</option>
            <option value="waves">Flowing Waves</option>
            <option value="cosmic">Cosmic Glow</option>
        </select>

        <button class="primary random" id="randomBtn">
            ✦ Generate New
        </button>
    </div>

    <div class="section">
        <div class="section-title">Colors</div>

        <div class="colors">
            <input class="colorBox" id="c1" type="color" value="#5b4cff">
            <input class="colorBox" id="c2" type="color" value="#ff4fd8">
            <input class="colorBox" id="c3" type="color" value="#18c8ff">
            <input class="colorBox" id="c4" type="color" value="#07152f">
            <input class="colorBox" id="c5" type="color" value="#ff8a3d">
            <input class="colorBox" id="c6" type="color" value="#ffffff">
        </div>

        <label>
            <span>Color Count</span>
            <span class="value" id="colorCountVal">4</span>
        </label>

        <input id="colorCount"
               type="range"
               min="2"
               max="6"
               step="1"
               value="4">
    </div>

    <div class="section">
        <div class="section-title">Motion</div>

        <label>
            <span>Speed</span>
            <span class="value" id="speedVal">0.50</span>
        </label>
        <input id="speed" type="range" min="0" max="2" step="0.01" value="0.50">

        <label>
            <span>Scale</span>
            <span class="value" id="scaleVal">1.00</span>
        </label>
        <input id="scale" type="range" min="0.25" max="3" step="0.01" value="1">

        <label>
            <span>Distortion</span>
            <span class="value" id="distortionVal">0.50</span>
        </label>
        <input id="distortion" type="range" min="0" max="2" step="0.01" value="0.50">
    </div>

    <div class="section">
        <div class="section-title">Image</div>

        <label>
            <span>Brightness</span>
            <span class="value" id="brightnessVal">1.00</span>
        </label>
        <input id="brightness" type="range" min="0.2" max="2" step="0.01" value="1">

        <label>
            <span>Saturation</span>
            <span class="value" id="saturationVal">1.00</span>
        </label>
        <input id="saturation" type="range" min="0" max="2" step="0.01" value="1">

        <label>
            <span>Contrast</span>
            <span class="value" id="contrastVal">1.00</span>
        </label>
        <input id="contrast" type="range" min="0.5" max="2" step="0.01" value="1">

        <label>
            <span>Grain</span>
            <span class="value" id="grainVal">0.00</span>
        </label>
        <input id="grain" type="range" min="0" max="0.25" step="0.001" value="0">
    </div>


    <div class="section">
        <div class="section-title">Video Export</div>

        <label>Resolution</label>
        <select id="exportResolution">
            <option value="1920x1080" selected>1920 × 1080 — Full HD</option>
            <option value="3840x2160">3840 × 2160 — 4K</option>
            <option value="1080x1920">1080 × 1920 — Vertical</option>
            <option value="2160x3840">2160 × 3840 — 4K Vertical</option>
        </select>

        <label>FPS</label>
        <select id="exportFps">
            <option value="30">30 FPS</option>
            <option value="60" selected>60 FPS</option>
        </select>

        <label>Duration</label>
        <select id="exportDuration">
            <option value="5">5 seconds</option>
            <option value="10" selected>10 seconds</option>
            <option value="15">15 seconds</option>
            <option value="30">30 seconds</option>
        </select>

        <div class="row" style="margin-top:10px">
            <button class="primary" id="exportBtn">⬇ Export WebM</button>
            <button id="stopExportBtn">■ Stop</button>
        </div>

        <div style="margin-top:9px;height:5px;background:#202733;border-radius:20px;overflow:hidden">
            <div id="exportProgress" style="height:100%;width:0%;background:#6977ff"></div>
        </div>

        <div class="small" id="exportStatus" style="margin-top:8px">
            Ready to export.
        </div>
    </div>

    <div class="section">
        <div class="section-title">Output</div>

        <label>Resolution</label>
        <select id="resolution">
            <option value="1920x1080">1920 × 1080</option>
            <option value="3840x2160">3840 × 2160 — 4K</option>
            <option value="1080x1920">1080 × 1920 — Vertical</option>
            <option value="2160x3840">2160 × 3840 — 4K Vertical</option>
        </select>

        <label>FPS</label>
        <select id="fps">
            <option value="30">30 FPS</option>
            <option value="60" selected>60 FPS</option>
        </select>

        <label>Duration</label>
        <select id="duration">
            <option value="5">5 seconds</option>
            <option value="10" selected>10 seconds</option>
            <option value="15">15 seconds</option>
            <option value="30">30 seconds</option>
        </select>
    </div>

</aside>


<main class="main">

    <div class="topbar">
        <div>
            <strong>LIVE PREVIEW</strong>
        </div>

        <div class="status" id="status">
            Ready
        </div>
    </div>

    <div class="preview">

        <canvas id="canvas" width="1280" height="720"></canvas>

        <div class="previewButtons">
            <button id="pauseBtn">Ⅱ Pause</button>
            <button id="fullscreenBtn">⛶ Fullscreen</button>
        </div>

    </div>

    <div class="bottom">

        <button id="playBtn">▶ Play</button>

        <span class="small">Seed:</span>

        <input
            class="seedBox"
            id="seed"
            type="number"
            value="384721"
        >

        <button id="applySeed">Apply</button>

        <div style="flex:1"></div>

        <span class="small" id="info">
            1280 × 720 Preview
        </span>

    </div>

</main>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let running = true;
let startTime = performance.now();

let params = {
    style:"liquid",
    speed:0.5,
    scale:1,
    distortion:0.5,
    brightness:1,
    saturation:1,
    contrast:1,
    grain:0,
    colorCount:4,
    seed:384721
};

function hash(n){
    n = Math.sin(n * 12.9898 + params.seed * 78.233) * 43758.5453;
    return n - Math.floor(n);
}

function noise(x,y){
    return (
        Math.sin(x * 1.7 + params.seed) *
        0.5 +
        Math.sin(y * 2.3 + params.seed * .3) *
        0.25 +
        Math.sin((x+y) * 3.1) *
        0.25
    );
}

function hexToRgb(hex){
    return [
        parseInt(hex.slice(1,3),16)/255,
        parseInt(hex.slice(3,5),16)/255,
        parseInt(hex.slice(5,7),16)/255
    ];
}

function getColors(){
    const count = params.colorCount;
    const ids = ["c1","c2","c3","c4","c5","c6"];

    return ids
        .slice(0,count)
        .map(id => hexToRgb(document.getElementById(id).value));
}

function palette(t, colors){

    t = Math.max(0,Math.min(.999,t));

    const pos = t * (colors.length-1);

    const i = Math.floor(pos);
    const f = pos-i;

    const a = colors[i];
    const b = colors[Math.min(i+1,colors.length-1)];

    return [
        a[0]*(1-f)+b[0]*f,
        a[1]*(1-f)+b[1]*f,
        a[2]*(1-f)+b[2]*f
    ];
}

function clamp(v){
    return Math.max(0,Math.min(1,v));
}

function render(){

    if(!running){
        requestAnimationFrame(render);
        return;
    }

    const now = performance.now();
    const time = (now-startTime)/1000 * params.speed;

    const w = canvas.width;
    const h = canvas.height;

    const image = ctx.createImageData(w,h);
    const data = image.data;

    const colors = getColors();

    const aspect = w/h;

    const style = params.style;

    let p = 0;

    // Render at a lighter internal sampling rate
    // while keeping the preview high quality.
    for(let y=0;y<h;y++){

        const ny = (y/h-.5)*2;

        for(let x=0;x<w;x++){

            const nx = ((x/w-.5)*2)*aspect;

            let xx = nx;
            let yy = ny;

            const d = params.distortion;

            if(style === "liquid"){
                xx += Math.sin(yy*3 + time*1.2)*.35*d;
                yy += Math.sin(xx*2.5 - time)*.25*d;
            }

            else if(style === "silk"){
                yy += Math.sin(nx*4 + time*1.4)*.35*d;
                xx += Math.sin(ny*2 - time*.8)*.15*d;
            }

            else if(style === "aurora"){
                xx += Math.sin(ny*5-time)*.3*d;
                yy += Math.sin(nx*2+time)*.15*d;
            }

            else if(style === "vortex"){
                const r = Math.sqrt(xx*xx+yy*yy);
                const a = Math.atan2(yy,xx)+r*2*d+time*.5;
                xx = Math.cos(a)*r;
                yy = Math.sin(a)*r;
            }

            else if(style === "ribbon"){
                yy += Math.sin(nx*5+time*1.3)*.22*d;
                yy += Math.sin(nx*11-time)*.08*d;
            }

            else if(style === "plasma"){
                xx += Math.sin(yy*7+time)*.15*d;
                yy += Math.cos(xx*6-time)*.15*d;
            }

            else if(style === "organic"){
                xx += Math.sin(yy*3+time)*.25*d;
                yy += Math.cos(xx*3-time*.7)*.25*d;
            }

            else if(style === "rings"){
                const r = Math.sqrt(xx*xx+yy*yy);
                const wave = Math.sin(r*8-time*1.5);
                xx += wave*.15*d;
                yy += wave*.15*d;
            }

            else if(style === "waves"){
                yy += Math.sin(nx*4+time)*.3*d;
                yy += Math.sin(nx*9-time*.5)*.1*d;
            }

            else if(style === "cosmic"){
                const r = Math.sqrt(xx*xx+yy*yy);
                xx += Math.sin(yy*8+time)*.12*d;
                yy += Math.cos(xx*7-time)*.12*d;
            }

            xx *= params.scale;
            yy *= params.scale;

            let value;

            if(style === "vortex"){
                value = .5 + .5*Math.sin(
                    Math.sqrt(xx*xx+yy*yy)*3 -
                    time
                );
            }
            else if(style === "rings"){
                value = .5 + .5*Math.sin(
                    Math.sqrt(xx*xx+yy*yy)*7-time*1.4
                );
            }
            else{
                value =
                    .5 +
                    .25*Math.sin(xx*2.4+time) +
                    .25*Math.cos(yy*2.1-time*.8);
            }

            value = clamp(value);

            let rgb = palette(value,colors);

            // Brightness
            rgb[0] *= params.brightness;
            rgb[1] *= params.brightness;
            rgb[2] *= params.brightness;

            // Saturation
            const lum =
                .299*rgb[0]+
                .587*rgb[1]+
                .114*rgb[2];

            rgb[0] = lum+(rgb[0]-lum)*params.saturation;
            rgb[1] = lum+(rgb[1]-lum)*params.saturation;
            rgb[2] = lum+(rgb[2]-lum)*params.saturation;

            // Contrast
            rgb[0] = (rgb[0]-.5)*params.contrast+.5;
            rgb[1] = (rgb[1]-.5)*params.contrast+.5;
            rgb[2] = (rgb[2]-.5)*params.contrast+.5;

            // Grain
            if(params.grain > 0){
                const g =
                    (hash(x*.01+y*.02+time*10)-.5) *
                    params.grain;

                rgb[0]+=g;
                rgb[1]+=g;
                rgb[2]+=g;
            }

            data[p++] = clamp(rgb[0])*255;
            data[p++] = clamp(rgb[1])*255;
            data[p++] = clamp(rgb[2])*255;
            data[p++] = 255;
        }
    }

    ctx.putImageData(image,0,0);

    requestAnimationFrame(render);
}


/* =========================
   VIDEO EXPORT — REALTIME CANVAS CAPTURE
   ========================= */

let exportRecorder = null;
let exportStream = null;
let exportRunning = false;
let exportChunks = [];
let exportRAF = 0;

function supportedMime(){
    const types = [
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
    ];

    for(const type of types){
        if(window.MediaRecorder &&
           MediaRecorder.isTypeSupported(type)){
            return type;
        }
    }

    return "";
}

function downloadVideo(blob, filename){

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = filename;

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>{
        URL.revokeObjectURL(url);
    },5000);
}


/*
    IMPORTANT:
    The live renderer is the same renderer used for export.

    We temporarily resize the SAME canvas to the requested
    output resolution, capture that canvas, and continuously
    render animation frames into it while MediaRecorder records.
*/

function exportVideo(){

    if(exportRunning){
        return;
    }

    if(!window.MediaRecorder ||
       !HTMLCanvasElement.prototype.captureStream){

        alert("Your browser does not support canvas video recording.");
        return;
    }

    const mime=supportedMime();

    if(!mime){

        alert("WebM recording is not supported in this browser.");
        return;
    }

    const resolution=
        document.getElementById("exportResolution").value;

    const fps=
        parseInt(
            document.getElementById("exportFps").value,
            10
        );

    const duration=
        parseInt(
            document.getElementById("exportDuration").value,
            10
        );

    const parts=
        resolution.split("x").map(Number);

    const outW=parts[0];
    const outH=parts[1];

    /*
       Save the live preview state.
    */

    const oldW=canvas.width;
    const oldH=canvas.height;

    const oldPlaying=playing;
    const oldStartTime=startTime;

    /*
       Set REAL recording resolution.
    */

    canvas.width=outW;
    canvas.height=outH;

    /*
       Start animation from time zero.
    */

    playing=true;
    startTime=performance.now();

    /*
       Draw an actual first frame BEFORE recording starts.
    */

    renderOneFrame(0);

    /*
       Capture the SAME canvas that is being rendered.
    */

    exportStream=
        canvas.captureStream(fps);

    exportChunks=[];
    exportRunning=true;

    const bitrate=
        outW>=3840
        ? 40000000
        : 25000000;

    exportRecorder=
        new MediaRecorder(
            exportStream,
            {
                mimeType:mime,
                videoBitsPerSecond:bitrate
            }
        );

    exportRecorder.ondataavailable=e=>{

        if(e.data && e.data.size>0){
            exportChunks.push(e.data);
        }

    };

    exportRecorder.onerror=e=>{

        console.error(
            "Recorder error:",
            e
        );

        finishExport(
            oldW,
            oldH,
            oldPlaying,
            oldStartTime,
            false
        );

    };

    exportRecorder.onstop=()=>{

        const blob=
            new Blob(
                exportChunks,
                {type:mime}
            );

        const filename=
            `Gradient_${outW}x${outH}_${fps}fps_${duration}s.webm`;

        downloadVideo(
            blob,
            filename
        );

        finishExport(
            oldW,
            oldH,
            oldPlaying,
            oldStartTime,
            true
        );

    };

    document.getElementById(
        "exportStatus"
    ).textContent=
        `Recording ${outW}×${outH} • ${fps} FPS • ${duration}s...`;

    document.getElementById(
        "exportProgress"
    ).style.width="0%";

    /*
       Start recording.

       250ms chunks prevent the browser from waiting
       until the very end before producing data.
    */

    exportRecorder.start(250);

    const recordingStart=
        performance.now();

    /*
       REALTIME rendering loop.

       This is the important fix:
       every animation frame is rendered into the
       canvas while MediaRecorder is capturing it.
    */

    function recordFrame(now){

        if(!exportRunning){
            return;
        }

        const elapsed=
            (now-recordingStart)/1000;

        if(elapsed>=duration){

            document.getElementById(
                "exportProgress"
            ).style.width="100%";

            if(
                exportRecorder &&
                exportRecorder.state!=="inactive"
            ){

                exportRecorder.stop();

            }

            return;
        }

        /*
           Render the current animation time.
        */

        renderOneFrame(
            elapsed
        );

        const percent=
            Math.min(
                99,
                elapsed/duration*100
            );

        document.getElementById(
            "exportProgress"
        ).style.width=
            percent+"%";

        exportRAF=
            requestAnimationFrame(
                recordFrame
            );

    }

    exportRAF=
        requestAnimationFrame(
            recordFrame
        );

}


/*
    Draw exactly one frame using the ORIGINAL
    2D renderer logic.
*/

function renderOneFrame(timeSeconds){

    const w=canvas.width;
    const h=canvas.height;

    const image=
        ctx.createImageData(w,h);

    const data=image.data;

    const colors=getColors();

    const aspect=w/h;

    const style=params.style;

    let p=0;

    /*
       At 4K this is intentionally expensive,
       but it gives the recorder real moving frames.
    */

    for(let y=0;y<h;y++){

        const ny=(y/h-.5)*2;

        for(let x=0;x<w;x++){

            const nx=
                ((x/w-.5)*2)*aspect;

            let xx=nx;
            let yy=ny;

            const d=params.distortion;

            if(style==="liquid"){

                xx +=
                    Math.sin(
                        yy*3+
                        timeSeconds*1.2
                    )*.35*d;

                yy +=
                    Math.sin(
                        xx*2.5-
                        timeSeconds
                    )*.25*d;

            }

            else if(style==="silk"){

                yy +=
                    Math.sin(
                        nx*4+
                        timeSeconds*1.4
                    )*.35*d;

                xx +=
                    Math.sin(
                        ny*2-
                        timeSeconds*.8
                    )*.15*d;

            }

            else if(style==="aurora"){

                xx +=
                    Math.sin(
                        ny*5-
                        timeSeconds
                    )*.3*d;

                yy +=
                    Math.sin(
                        nx*2+
                        timeSeconds
                    )*.15*d;

            }

            else if(style==="vortex"){

                const r=
                    Math.sqrt(
                        xx*xx+
                        yy*yy
                    );

                const a=
                    Math.atan2(yy,xx)+
                    r*2*d+
                    timeSeconds*.5;

                xx=Math.cos(a)*r;
                yy=Math.sin(a)*r;

            }

            else if(style==="ribbon"){

                yy +=
                    Math.sin(
                        nx*5+
                        timeSeconds*1.3
                    )*.22*d;

                yy +=
                    Math.sin(
                        nx*11-
                        timeSeconds
                    )*.08*d;

            }

            else if(style==="plasma"){

                xx +=
                    Math.sin(
                        yy*7+
                        timeSeconds
                    )*.15*d;

                yy +=
                    Math.cos(
                        xx*6-
                        timeSeconds
                    )*.15*d;

            }

            else if(style==="organic"){

                xx +=
                    Math.sin(
                        yy*3+
                        timeSeconds
                    )*.25*d;

                yy +=
                    Math.cos(
                        xx*3-
                        timeSeconds*.7
                    )*.25*d;

            }

            else if(style==="rings"){

                const r=
                    Math.sqrt(
                        xx*xx+
                        yy*yy
                    );

                const wave=
                    Math.sin(
                        r*8-
                        timeSeconds*1.5
                    );

                xx+=wave*.15*d;
                yy+=wave*.15*d;

            }

            else if(style==="waves"){

                yy +=
                    Math.sin(
                        nx*4+
                        timeSeconds
                    )*.3*d;

                yy +=
                    Math.sin(
                        nx*9-
                        timeSeconds*.5
                    )*.1*d;

            }

            else if(style==="cosmic"){

                xx +=
                    Math.sin(
                        yy*8+
                        timeSeconds
                    )*.12*d;

                yy +=
                    Math.cos(
                        xx*7-
                        timeSeconds
                    )*.12*d;

            }

            xx*=params.scale;
            yy*=params.scale;

            let value;

            if(style==="vortex"){

                value=
                    .5+
                    .5*Math.sin(
                        Math.sqrt(
                            xx*xx+
                            yy*yy
                        )*3-
                        timeSeconds
                    );

            }

            else if(style==="rings"){

                value=
                    .5+
                    .5*Math.sin(
                        Math.sqrt(
                            xx*xx+
                            yy*yy
                        )*7-
                        timeSeconds*1.4
                    );

            }

            else{

                value=
                    .5+
                    .25*Math.sin(
                        xx*2.4+
                        timeSeconds
                    )+
                    .25*Math.cos(
                        yy*2.1-
                        timeSeconds*.8
                    );

            }

            value=clamp(value);

            let rgb=
                palette(
                    value,
                    colors
                );

            rgb[0]*=params.brightness;
            rgb[1]*=params.brightness;
            rgb[2]*=params.brightness;

            const lum=
                .299*rgb[0]+
                .587*rgb[1]+
                .114*rgb[2];

            rgb[0]=
                lum+
                (rgb[0]-lum)*
                params.saturation;

            rgb[1]=
                lum+
                (rgb[1]-lum)*
                params.saturation;

            rgb[2]=
                lum+
                (rgb[2]-lum)*
                params.saturation;

            rgb[0]=
                (rgb[0]-.5)*
                params.contrast+
                .5;

            rgb[1]=
                (rgb[1]-.5)*
                params.contrast+
                .5;

            rgb[2]=
                (rgb[2]-.5)*
                params.contrast+
                .5;

            if(params.grain>0){

                const g=
                    (
                        hash(
                            x*.01+
                            y*.02+
                            timeSeconds*10
                        )-
                        .5
                    )*
                    params.grain;

                rgb[0]+=g;
                rgb[1]+=g;
                rgb[2]+=g;

            }

            data[p++]=clamp(rgb[0])*255;
            data[p++]=clamp(rgb[1])*255;
            data[p++]=clamp(rgb[2])*255;
            data[p++]=255;

        }

    }

    ctx.putImageData(
        image,
        0,
        0
    );

}


/*
    Restore the live preview after export.
*/

function finishExport(
    oldW,
    oldH,
    oldPlaying,
    oldStartTime,
    success
){

    if(exportRAF){
        cancelAnimationFrame(exportRAF);
        exportRAF=0;
    }

    if(exportStream){

        exportStream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

    }

    exportStream=null;
    exportRecorder=null;
    exportRunning=false;

    canvas.width=oldW;
    canvas.height=oldH;

    playing=oldPlaying;
    startTime=oldStartTime;

    if(success){

        document.getElementById(
            "exportStatus"
        ).textContent=
            "Export complete — video downloaded.";

        document.getElementById(
            "exportProgress"
        ).style.width="100%";

    }

    else{

        document.getElementById(
            "exportStatus"
        ).textContent=
            "Export stopped.";

    }

}


/*
    Stop button.
*/

function stopExport(){

    if(!exportRunning){
        return;
    }

    exportRunning=false;

    if(exportRAF){
        cancelAnimationFrame(exportRAF);
        exportRAF=0;
    }

    if(
        exportRecorder &&
        exportRecorder.state!=="inactive"
    ){

        exportRecorder.stop();

    }

}


function randomHex(){
    return "#"+Math.floor(
        Math.random()*16777215
    ).toString(16).padStart(6,"0");
}

function randomize(){

    const styles = [
        "liquid",
        "silk",
        "aurora",
        "vortex",
        "ribbon",
        "plasma",
        "organic",
        "rings",
        "waves",
        "cosmic"
    ];

    const style =
        styles[Math.floor(Math.random()*styles.length)];

    document.getElementById("style").value = style;

    params.style = style;

    params.speed = .15 + Math.random()*1.1;
    params.scale = .5 + Math.random()*1.7;
    params.distortion = Math.random()*1.5;
    params.brightness = .75 + Math.random()*.5;
    params.saturation = .7 + Math.random()*1;
    params.contrast = .8 + Math.random()*.6;
    params.grain = Math.random()*.04;
    params.colorCount = 3 + Math.floor(Math.random()*4);
    params.seed = Math.floor(Math.random()*99999999);

    document.getElementById("seed").value=params.seed;

    const colors = [
        "#"+randomHex().slice(1),
        "#"+randomHex().slice(1),
        "#"+randomHex().slice(1),
        "#"+randomHex().slice(1),
        "#"+randomHex().slice(1),
        "#"+randomHex().slice(1)
    ];

    colors.forEach((c,i)=>{
        document.getElementById("c"+(i+1)).value=c;
    });

    updateUI();
}

function updateUI(){

    document.getElementById("speed").value=params.speed;
    document.getElementById("scale").value=params.scale;
    document.getElementById("distortion").value=params.distortion;
    document.getElementById("brightness").value=params.brightness;
    document.getElementById("saturation").value=params.saturation;
    document.getElementById("contrast").value=params.contrast;
    document.getElementById("grain").value=params.grain;
    document.getElementById("colorCount").value=params.colorCount;

    document.getElementById("speedVal").textContent=params.speed.toFixed(2);
    document.getElementById("scaleVal").textContent=params.scale.toFixed(2);
    document.getElementById("distortionVal").textContent=params.distortion.toFixed(2);
    document.getElementById("brightnessVal").textContent=params.brightness.toFixed(2);
    document.getElementById("saturationVal").textContent=params.saturation.toFixed(2);
    document.getElementById("contrastVal").textContent=params.contrast.toFixed(2);
    document.getElementById("grainVal").textContent=params.grain.toFixed(3);
    document.getElementById("colorCountVal").textContent=params.colorCount;

    document.getElementById("status").textContent =
        "Live • "+params.style;
}

function bindRange(id,key,valId){

    const el=document.getElementById(id);

    el.addEventListener("input",()=>{

        params[key]=parseFloat(el.value);

        document.getElementById(valId).textContent =
            parseFloat(el.value).toFixed(
                key==="grain"?3:2
            );
    });
}

bindRange("speed","speed","speedVal");
bindRange("scale","scale","scaleVal");
bindRange("distortion","distortion","distortionVal");
bindRange("brightness","brightness","brightnessVal");
bindRange("saturation","saturation","saturationVal");
bindRange("contrast","contrast","contrastVal");
bindRange("grain","grain","grainVal");

document.getElementById("style")
.addEventListener("change",e=>{
    params.style=e.target.value;
    updateUI();
});

document.getElementById("colorCount")
.addEventListener("input",e=>{
    params.colorCount=parseInt(e.target.value);
    document.getElementById("colorCountVal").textContent=params.colorCount;
});

document.querySelectorAll(".colorBox")
.forEach(el=>{
    el.addEventListener("input",()=>{
        document.getElementById("status").textContent="Color updated";
    });
});

document.getElementById("randomBtn")
.addEventListener("click",randomize);

document.getElementById("pauseBtn")
.addEventListener("click",()=>{

    running=!running;

    document.getElementById("pauseBtn").textContent =
        running ? "Ⅱ Pause" : "▶ Resume";
});

document.getElementById("playBtn")
.addEventListener("click",()=>{

    running=true;

    document.getElementById("pauseBtn").textContent="Ⅱ Pause";
});

document.getElementById("applySeed")
.addEventListener("click",()=>{

    params.seed=parseInt(
        document.getElementById("seed").value
    ) || 1;

    updateUI();
});

document.getElementById("fullscreenBtn")
.addEventListener("click",()=>{

    if(canvas.requestFullscreen){
        canvas.requestFullscreen();
    }
});

document.getElementById("resolution")
.addEventListener("change",e=>{
    const [w,h]=e.target.value.split("x").map(Number);
    document.getElementById("info").textContent =
        `${w} × ${h} Output • Preview stays 1280 × 720`;
});

randomize();

render();

</script>
