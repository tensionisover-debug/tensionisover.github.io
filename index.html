<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradient Motion Studio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0f;color:#fff;font-family:Arial,Helvetica,sans-serif}
.app{height:100vh;display:flex}
.sidebar{width:330px;min-width:330px;background:#11151c;border-right:1px solid #252b35;padding:20px;overflow-y:auto}
.logo{font-size:21px;font-weight:700}.sub{font-size:12px;color:#8993a3;margin:4px 0 20px}
.section{margin-top:20px}.section-title{font-size:10px;font-weight:700;letter-spacing:1px;color:#8e98a8;text-transform:uppercase;margin-bottom:10px}
label{display:flex;justify-content:space-between;font-size:11px;color:#cbd2dc;margin:9px 0 5px}
select,input[type=number]{width:100%;background:#1a2029;border:1px solid #303846;color:#fff;border-radius:7px;padding:9px;outline:0}
input[type=range]{width:100%;accent-color:#7c8cff}
.colors{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.color{width:100%;height:36px;border:0;padding:0;border-radius:7px;background:transparent;cursor:pointer}
button{border:0;border-radius:8px;padding:10px 13px;color:#fff;background:#202733;cursor:pointer;font-weight:600}button:hover{background:#2b3442}.primary{width:100%;background:#5968ff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;border-bottom:1px solid #252b35;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.status{font-size:11px;color:#929baa}.preview{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:18px;background:#080a0e}
canvas{display:block;width:min(100%,1280px);height:auto;aspect-ratio:16/9;background:#000;box-shadow:0 15px 60px rgba(0,0,0,.4)}
.bottom{height:54px;border-top:1px solid #252b35;display:flex;align-items:center;gap:8px;padding:0 18px}.small{font-size:10px;color:#8e98a8}.seed{width:130px!important}
@media(max-width:800px){.sidebar{width:270px;min-width:270px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">Gradient Motion Studio</div>
<div class="sub">Smooth procedural motion backgrounds</div>

<div class="section">
<div class="section-title">Background Type</div>
<select id="style">
<option value="liquid">Liquid Flow</option><option value="silk">Silk Waves</option>
<option value="waves">Flowing Waves</option><option value="ribbon">Fluid Ribbons</option>
<option value="aurora">Aurora</option><option value="plasma">Plasma</option>
<option value="nebula">Nebula</option><option value="smoke">Smoke</option>
<option value="clouds">Clouds</option><option value="cosmic">Cosmic Glow</option>
<option value="vortex">Vortex</option><option value="spiral">Spiral</option>
<option value="rings">Soft Rings</option><option value="tunnel">Tunnel</option>
<option value="warp">Warp Space</option><option value="organic">Organic Blobs</option>
<option value="marble">Digital Marble</option><option value="lava">Lava Flow</option>
<option value="water">Water Flow</option><option value="sand">Soft Dunes</option>
<option value="topographic">Topographic</option><option value="grid">Abstract Grid</option>
<option value="lines">Dynamic Lines</option><option value="cells">Organic Cells</option>
<option value="noise">Abstract Noise</option><option value="bokeh">Soft Bokeh</option>
<option value="sunset">Soft Sunset</option><option value="folds">Light Folds</option>
<option value="energy">Energy Flow</option><option value="particles">Flowing Particles</option>
</select>
<button class="primary" id="random" style="margin-top:9px">✦ Generate New</button>
</div>

<div class="section">
<div class="section-title">Colors</div>
<div class="colors">
<input class="color" id="c1" type="color" value="#5b4cff"><input class="color" id="c2" type="color" value="#ff4fd8">
<input class="color" id="c3" type="color" value="#18c8ff"><input class="color" id="c4" type="color" value="#07152f">
<input class="color" id="c5" type="color" value="#ff8a3d"><input class="color" id="c6" type="color" value="#ffffff">
</div>
<label><span>Color Count</span><span id="colorCountVal">4</span></label>
<input id="colorCount" type="range" min="2" max="6" value="4">
</div>

<div class="section">
<div class="section-title">Motion</div>
<label><span>Speed</span><span id="speedVal">0.50</span></label><input id="speed" type="range" min="0" max="2" step=".01" value=".5">
<label><span>Scale</span><span id="scaleVal">1.00</span></label><input id="scale" type="range" min=".4" max="3" step=".01" value="1">
<label><span>Distortion</span><span id="distortionVal">0.50</span></label><input id="distortion" type="range" min="0" max="2" step=".01" value=".5">
<label><span>Frequency</span><span id="frequencyVal">2.00</span></label><input id="frequency" type="range" min=".3" max="8" step=".01" value="2">
<label><span>Rotation</span><span id="rotationVal">0.00</span></label><input id="rotation" type="range" min="-3.14" max="3.14" step=".01" value="0">
</div>

<div class="section">
<div class="section-title">Look</div>
<label><span>Brightness</span><span id="brightnessVal">1.00</span></label><input id="brightness" type="range" min=".3" max="1.8" step=".01" value="1">
<label><span>Saturation</span><span id="saturationVal">1.00</span></label><input id="saturation" type="range" min="0" max="2" step=".01" value="1">
<label><span>Contrast</span><span id="contrastVal">1.00</span></label><input id="contrast" type="range" min=".5" max="1.8" step=".01" value="1">
<label><span>Glow</span><span id="glowVal">0.20</span></label><input id="glow" type="range" min="0" max="1" step=".01" value=".2">
<label><span>Softness</span><span id="softnessVal">0.50</span></label><input id="softness" type="range" min="0" max="1" step=".01" value=".5">
<label><span>Grain</span><span id="grainVal">0.00</span></label><input id="grain" type="range" min="0" max=".08" step=".001" value="0">
<label><span>Vignette</span><span id="vignetteVal">0.00</span></label><input id="vignette" type="range" min="0" max=".8" step=".01" value="0">
</div>

<div class="section">
<div class="section-title">Variation</div>
<div class="row"><input id="seed" class="seed" type="number" value="384721"><button id="applySeed">Apply Seed</button></div>
</div>
</aside>

<main class="main">
<div class="topbar"><strong>LIVE PREVIEW</strong><div class="status" id="status">60 FPS • Live</div></div>
<div class="preview"><canvas id="canvas" width="960" height="540"></canvas></div>
<div class="bottom"><button id="pause">Ⅱ Pause</button><button id="random2">✦ Random</button><div style="flex:1"></div><span class="small" id="info">960 × 540 • Smooth Preview</span></div>
</main>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});
const W=canvas.width,H=canvas.height;
let running=true, start=performance.now();

const p={
style:"liquid",speed:.5,scale:1,distortion:.5,frequency:2,rotation:0,
brightness:1,saturation:1,contrast:1,glow:.2,softness:.5,grain:0,vignette:0,
colorCount:4,seed:384721
};

const styles=[
"liquid","silk","waves","ribbon","aurora","plasma","nebula","smoke","clouds","cosmic",
"vortex","spiral","rings","tunnel","warp","organic","marble","lava","water","sand",
"topographic","grid","lines","cells","noise","bokeh","sunset","folds","energy","particles"
];

function colors(){
 let a=[];
 for(let i=1;i<=6;i++){
  const h=document.getElementById("c"+i).value;
  a.push(h);
 }
 return a.slice(0,p.colorCount);
}
function rgba(hex,a){
 const n=parseInt(hex.slice(1),16);
 return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}
function mixColor(hex,a,bg="#000000"){
 return rgba(hex,a);
}
function seedRand(n){
 const x=Math.sin(n*12.9898+p.seed*78.233)*43758.5453;
 return x-Math.floor(x);
}
function setupTransform(t){
 ctx.translate(W/2,H/2);
 ctx.rotate(p.rotation);
 ctx.scale(p.scale,p.scale);
}
function gradient(t,mode){
 const cs=colors();
 const x=Math.sin(t*.17)*W*.12;
 const y=Math.cos(t*.13)*H*.12;
 let g;
 if(mode==="radial"){
  g=ctx.createRadialGradient(x,y,10,0,0,Math.max(W,H)*.75);
 }else{
  g=ctx.createLinearGradient(-W*.6+x,-H*.5+y,W*.6-x,H*.5-y);
 }
 for(let i=0;i<cs.length;i++)g.addColorStop(i/(cs.length-1),cs[i]);
 return g;
}
function drawBase(t){
 ctx.fillStyle="#05070b";ctx.fillRect(0,0,W,H);
 ctx.save();setupTransform(t);
 const s=p.style, d=p.distortion, f=p.frequency;
 if(["smoke","clouds","nebula","noise"].includes(s)){
  ctx.globalAlpha=.18+p.softness*.15;
  for(let i=0;i<28;i++){
   const q=seedRand(i*7.31);
   const x=Math.sin(t*.13+i*2.7)*W*.42;
   const y=Math.cos(t*.11+i*3.1)*H*.35;
   const r=(40+q*140)*(1+d*.35);
   const grd=ctx.createRadialGradient(x,y,0,x,y,r);
   grd.addColorStop(0,rgba(colors()[i%colors().length],.9));
   grd.addColorStop(1,rgba(colors()[(i+1)%colors().length],0));
   ctx.fillStyle=grd;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
 }else if(["vortex","spiral","tunnel"].includes(s)){
  for(let i=0;i<9;i++){
   const rr=70+i*80+Math.sin(t*1.1+i)*25*d;
   ctx.globalAlpha=.14;
   ctx.strokeStyle=colors()[i%colors().length];
   ctx.lineWidth=18+20*p.softness;
   ctx.beginPath();
   for(let a=0;a<Math.PI*2+.2;a+=.08){
    const r=rr+a*22*d;
    const ang=a+t*(.35+i*.018)*(s==="tunnel"?-1:1);
    const x=Math.cos(ang)*r,y=Math.sin(ang)*r;
    if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
   }
   ctx.stroke();
  }
 }else if(["rings","topographic"].includes(s)){
  for(let i=0;i<18;i++){
   const rr=40+i*48+Math.sin(t+i)*12*d;
   ctx.globalAlpha=.13;
   ctx.strokeStyle=colors()[i%colors().length];
   ctx.lineWidth=8+10*p.softness;
   ctx.beginPath();ctx.arc(Math.sin(t*.2+i)*20,Math.cos(t*.17+i)*20,rr,0,Math.PI*2);ctx.stroke();
  }
 }else if(["grid","lines","folds"].includes(s)){
  ctx.globalAlpha=.16;
  ctx.lineWidth=4+5*p.softness;
  for(let i=-12;i<=12;i++){
   ctx.strokeStyle=colors()[(i+20)%colors().length];
   ctx.beginPath();
   const off=Math.sin(t*(s==="folds"?1:.7)+i)*35*d;
   ctx.moveTo(-W,i*75+off);ctx.lineTo(W,i*75-off);ctx.stroke();
  }
 }else if(s==="particles"){
  for(let i=0;i<130;i++){
   const q=seedRand(i+1);
   const ang=q*Math.PI*2+t*(.15+seedRand(i+22)*.5);
   const r=(80+seedRand(i+41)*420);
   const x=Math.cos(ang)*r,y=Math.sin(ang)*r;
   ctx.globalAlpha=.25+seedRand(i+5)*.5;
   ctx.fillStyle=colors()[i%colors().length];
   ctx.beginPath();ctx.arc(x,y,1.5+seedRand(i+9)*4,0,Math.PI*2);ctx.fill();
  }
 }else{
  // Smooth moving layered gradients: no per-pixel CPU loop.
  ctx.globalAlpha=1;
  ctx.fillStyle=gradient(t,s==="cosmic"?"radial":"linear");
  ctx.fillRect(-W,-H,W*2,H*2);
  const cs=colors();
  const count=6;
  for(let i=0;i<count;i++){
   const q=i/count;
   const x=Math.sin(t*(.35+q*.17)+i*1.7)*W*.42;
   const y=Math.cos(t*(.28+q*.13)+i*2.2)*H*.35;
   const r=(180+100*Math.sin(t*.4+i))* (1+d*.35);
   const gr=ctx.createRadialGradient(x,y,0,x,y,r);
   gr.addColorStop(0,rgba(cs[i%cs.length],.34+p.glow*.22));
   gr.addColorStop(1,rgba(cs[(i+1)%cs.length],0));
   ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
 }
 ctx.restore();

 // Global finishing effects
 if(p.vignette>0){
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.72);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,`rgba(0,0,0,${p.vignette*.55})`);
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
 }
}
function render(now){
 if(running){
  const t=(now-start)/1000*p.speed;
  drawBase(t);
 }
 requestAnimationFrame(render);
}
function bind(id,key,val){
 const e=document.getElementById(id);
 e.addEventListener("input",()=>{
  p[key]=parseFloat(e.value);
  document.getElementById(val).textContent=p[key].toFixed(key==="grain"?3:2);
 });
}
bind("speed","speed","speedVal");bind("scale","scale","scaleVal");bind("distortion","distortion","distortionVal");
bind("frequency","frequency","frequencyVal");bind("rotation","rotation","rotationVal");
bind("brightness","brightness","brightnessVal");bind("saturation","saturation","saturationVal");
bind("contrast","contrast","contrastVal");bind("glow","glow","glowVal");bind("softness","softness","softnessVal");
bind("grain","grain","grainVal");bind("vignette","vignette","vignetteVal");

document.getElementById("style").addEventListener("change",e=>{
 p.style=e.target.value;document.getElementById("status").textContent="60 FPS • "+p.style;
});
document.getElementById("colorCount").addEventListener("input",e=>{
 p.colorCount=+e.target.value;document.getElementById("colorCountVal").textContent=p.colorCount;
});
document.getElementById("applySeed").onclick=()=>{
 p.seed=parseInt(document.getElementById("seed").value)||1;start=performance.now();
};
function randomHex(){return "#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0")}
function randomize(){
 p.style=styles[Math.floor(Math.random()*styles.length)];
 p.speed=.2+Math.random()*1.1;p.scale=.7+Math.random()*1.4;p.distortion=Math.random()*1.5;
 p.frequency=.6+Math.random()*4.5;p.rotation=-3.14+Math.random()*6.28;
 p.brightness=.85+Math.random()*.35;p.saturation=.75+Math.random()*1.1;p.contrast=.85+Math.random()*.5;
 p.glow=Math.random()*.8;p.softness=.2+Math.random()*.8;p.grain=Math.random()*.02;p.vignette=Math.random()*.3;
 p.colorCount=2+Math.floor(Math.random()*5);p.seed=Math.floor(Math.random()*999999999);
 document.getElementById("style").value=p.style;document.getElementById("seed").value=p.seed;
 for(let i=1;i<=6;i++)document.getElementById("c"+i).value=randomHex();
 sync();start=performance.now();
}
function sync(){
 const ids=["speed","scale","distortion","frequency","rotation","brightness","saturation","contrast","glow","softness","grain","vignette"];
 ids.forEach(id=>{document.getElementById(id).value=p[id];document.getElementById(id+"Val").textContent=p[id].toFixed(id==="grain"?3:2)});
 document.getElementById("colorCount").value=p.colorCount;document.getElementById("colorCountVal").textContent=p.colorCount;
}
document.getElementById("random").onclick=randomize;document.getElementById("random2").onclick=randomize;
document.getElementById("pause").onclick=()=>{
 running=!running;document.getElementById("pause").textContent=running?"Ⅱ Pause":"▶ Resume";
 if(running)start=performance.now();
};
sync();
drawBase(0);
requestAnimationFrame(render);
</script>
</body>
</html>
