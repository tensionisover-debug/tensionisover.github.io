<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gradient Stock Generator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0b0d12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
}

.sidebar{
    width:330px;
    min-width:330px;
    background:#11151c;
    border-right:1px solid #252b35;
    padding:20px;
    overflow-y:auto;
}

.logo{
    font-size:21px;
    font-weight:700;
    margin-bottom:4px;
}

.sub{
    color:#8993a3;
    font-size:12px;
    margin-bottom:22px;
}

.section{
    margin-top:22px;
}

.section-title{
    font-size:11px;
    font-weight:700;
    color:#8e98a8;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:12px;
}

label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#cbd2dc;
    margin:11px 0 6px;
}

.value{
    color:#fff;
}

select,
input[type="number"]{
    width:100%;
    background:#1a2029;
    border:1px solid #303846;
    color:#fff;
    border-radius:7px;
    padding:9px;
    outline:none;
}

input[type="range"]{
    width:100%;
    accent-color:#7c8cff;
}

.colors{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.colorBox{
    width:100%;
    height:40px;
    border:0;
    padding:0;
    border-radius:7px;
    background:transparent;
    cursor:pointer;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    color:#fff;
    background:#202733;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    background:#2b3442;
}

.primary{
    width:100%;
    background:#5968ff;
}

.primary:hover{
    background:#6876ff;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.random{
    margin-top:12px;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:60px;
    border-bottom:1px solid #252b35;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.status{
    font-size:12px;
    color:#929baa;
}

.preview{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:#080a0e;
}

canvas{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    display:block;
    box-shadow:0 15px 60px rgba(0,0,0,.45);
}

.previewButtons{
    position:absolute;
    right:20px;
    bottom:20px;
    display:flex;
    gap:8px;
}

.bottom{
    height:55px;
    border-top:1px solid #252b35;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 18px;
}

.seedBox{
    width:130px;
}

.small{
    font-size:11px;
    color:#8e98a8;
}

@media(max-width:800px){
    .sidebar{
        width:270px;
        min-width:270px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">Gradient Stock Generator</div>
    <div class="sub">Procedural motion backgrounds</div>

    <div class="section">
        <div class="section-title">Style</div>

        <select id="style">
<option value="liquid">Liquid Flow</option>
<option value="silk">Silk / Fabric</option>
<option value="waves">Flowing Waves</option>
<option value="ribbon">Fluid Ribbons</option>
<option value="smoke">Soft Smoke</option>
<option value="clouds">Clouds</option>
<option value="aurora">Aurora</option>
<option value="plasma">Plasma</option>
<option value="nebula">Nebula</option>
<option value="cosmic">Cosmic Glow</option>
<option value="vortex">Vortex</option>
<option value="spiral">Spiral</option>
<option value="rings">Soft Rings</option>
<option value="tunnel">Tunnel</option>
<option value="warp">Warp Space</option>
<option value="organic">Organic Blobs</option>
<option value="marble">Digital Marble</option>
<option value="lava">Lava Flow</option>
<option value="water">Water Flow</option>
<option value="sand">Soft Sand</option>
<option value="topographic">Topographic</option>
<option value="grid">Abstract Grid</option>
<option value="lines">Dynamic Lines</option>
<option value="cells">Organic Cells</option>
<option value="noise">Abstract Noise</option>
<option value="bokeh">Soft Bokeh</option>
<option value="sunset">Soft Sunset</option>
<option value="folds">Light Folds</option>
<option value="energy">Energy Flow</option>
<option value="particles">Flowing Particles</option>
</select>

        <button class="primary random" id="randomBtn">
            ✦ Generate New
        </button>
    </div>

    <div class="section">
        <div class="section-title">Colors</div>

        <div class="colors">
            <input class="colorBox" id="c1" type="color" value="#5b4cff">
            <input class="colorBox" id="c2" type="color" value="#ff4fd8">
            <input class="colorBox" id="c3" type="color" value="#18c8ff">
            <input class="colorBox" id="c4" type="color" value="#07152f">
            <input class="colorBox" id="c5" type="color" value="#ff8a3d">
            <input class="colorBox" id="c6" type="color" value="#ffffff">
        </div>

        <label>
            <span>Color Count</span>
            <span class="value" id="colorCountVal">4</span>
        </label>

        <input id="colorCount"
               type="range"
               min="2"
               max="6"
               step="1"
               value="4">
    </div>

    <div class="section">
        <div class="section-title">Motion</div>

        <label>
            <span>Speed</span>
            <span class="value" id="speedVal">0.50</span>
        </label>
        <input id="speed" type="range" min="0" max="2" step="0.01" value="0.50">

        <label>
            <span>Scale</span>
            <span class="value" id="scaleVal">1.00</span>
        </label>
        <input id="scale" type="range" min="0.25" max="3" step="0.01" value="1">

        <label>
            <span>Distortion</span>
            <span class="value" id="distortionVal">0.50</span>
        </label>
        <input id="distortion" type="range" min="0" max="2" step="0.01" value="0.50">
    </div>

    <div class="section">
        <div class="section-title">Image</div>

        <label>
            <span>Brightness</span>
            <span class="value" id="brightnessVal">1.00</span>
        </label>
        <input id="brightness" type="range" min="0.2" max="2" step="0.01" value="1">

        <label>
            <span>Saturation</span>
            <span class="value" id="saturationVal">1.00</span>
        </label>
        <input id="saturation" type="range" min="0" max="2" step="0.01" value="1">

        <label>
            <span>Contrast</span>
            <span class="value" id="contrastVal">1.00</span>
        </label>
        <input id="contrast" type="range" min="0.5" max="2" step="0.01" value="1">

        <label>
            <span>Grain</span>
            <span class="value" id="grainVal">0.00</span>
        </label>
        <input id="grain" type="range" min="0" max="0.25" step="0.001" value="0">
    </div>

    <div class="section">
        <div class="section-title">Output</div>

        <label>Resolution</label>
        <select id="resolution">
            <option value="1920x1080">1920 × 1080</option>
            <option value="3840x2160">3840 × 2160 — 4K</option>
            <option value="1080x1920">1080 × 1920 — Vertical</option>
            <option value="2160x3840">2160 × 3840 — 4K Vertical</option>
        </select>

        <label>FPS</label>
        <select id="fps">
            <option value="30">30 FPS</option>
            <option value="60" selected>60 FPS</option>
        </select>

        <label>Duration</label>
        <select id="duration">
            <option value="5">5 seconds</option>
            <option value="10" selected>10 seconds</option>
            <option value="15">15 seconds</option>
            <option value="30">30 seconds</option>
        </select>
    </div>

</aside>


<main class="main">

    <div class="topbar">
        <div>
            <strong>LIVE PREVIEW</strong>
        </div>

        <div class="status" id="status">
            Ready
        </div>
    </div>

    <div class="preview">

        <canvas id="canvas" width="960" height="540"></canvas>

        <div class="previewButtons">
            <button id="pauseBtn">Ⅱ Pause</button>
            <button id="fullscreenBtn">⛶ Fullscreen</button>
        </div>

    </div>

    <div class="bottom">

        <button id="playBtn">▶ Play</button>

        <span class="small">Seed:</span>

        <input
            class="seedBox"
            id="seed"
            type="number"
            value="384721"
        >

        <button id="applySeed">Apply</button>

        <div style="flex:1"></div>

        <span class="small" id="info">
            1280 × 720 Preview
        </span>

    </div>

</main>

</div>



<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});

const params={
 style:"liquid",
 speed:.5,
 scale:1,
 distortion:.5,
 frequency:2,
 rotation:0,
 brightness:1,
 saturation:1,
 contrast:1,
 softness:.5,
 glow:.2,
 grain:0,
 vignette:0,
 colorCount:4,
 seed:384721
};

const styleNames=[
"liquid","silk","waves","ribbon","smoke","clouds","aurora","plasma",
"nebula","cosmic","vortex","spiral","rings","tunnel","warp","organic",
"marble","lava","water","sand","topographic","grid","lines","cells",
"noise","bokeh","sunset","folds","energy","particles"
];

function clamp(v){return v<0?0:v>1?1:v}

function hash(x,y,seed){
    const n=Math.sin(x*12.9898+y*78.233+seed*37.719)*43758.5453;
    return n-Math.floor(n);
}

function smoothNoise(x,y){
    const ix=Math.floor(x), iy=Math.floor(y);
    const fx=x-ix, fy=y-iy;
    const sx=fx*fx*(3-2*fx);
    const sy=fy*fy*(3-2*fy);
    const a=hash(ix,iy,params.seed);
    const b=hash(ix+1,iy,params.seed);
    const c=hash(ix,iy+1,params.seed);
    const d=hash(ix+1,iy+1,params.seed);
    return (a+(b-a)*sx)+((c+(d-c)*sx)-(a+(b-a)*sx))*sy;
}

function fbm(x,y){
    let v=0,a=.5;
    for(let i=0;i<3;i++){
        v+=smoothNoise(x,y)*a;
        x*=2;y*=2;a*=.5;
    }
    return v;
}

function getColors(){
    const out=[];
    for(let i=1;i<=6;i++){
        const h=document.getElementById("c"+i).value;
        out.push([
            parseInt(h.slice(1,3),16)/255,
            parseInt(h.slice(3,5),16)/255,
            parseInt(h.slice(5,7),16)/255
        ]);
    }
    return out;
}

function palette(t,colors){
    t=clamp(t);
    const n=Math.max(2,Math.min(6,params.colorCount));
    const pos=t*(n-1);
    const i=Math.min(n-2,Math.floor(pos));
    const f=pos-i;
    return [
        colors[i][0]+(colors[i+1][0]-colors[i][0])*f,
        colors[i][1]+(colors[i+1][1]-colors[i][1])*f,
        colors[i][2]+(colors[i+1][2]-colors[i][2])*f
    ];
}

function render(now){
    if(!playing){
        requestAnimationFrame(render);
        return;
    }

    const t=(now-startTime)/1000*params.speed;
    const w=canvas.width,h=canvas.height;
    const image=ctx.createImageData(w,h);
    const data=image.data;
    const colors=getColors();
    const aspect=w/h;

    // Pixel step keeps the 2D renderer light enough for smooth 60fps preview.
    // At 960x540 this remains much lighter than the old 1280x720 renderer.
    let p=0;

    for(let y=0;y<h;y++){
        const v0=(y/h-.5)*2;

        for(let x=0;x<w;x++){
            const u0=((x/w-.5)*2)*aspect;

            let x1=u0*params.scale;
            let y1=v0*params.scale;

            const d=params.distortion;
            const f=params.frequency;

            if(params.style==="liquid"){
                x1+=Math.sin(y1*3*f+t*1.1)*.22*d;
                y1+=Math.sin(x1*2.2*f-t*.8)*.20*d;
            }else if(params.style==="silk"){
                y1+=Math.sin(x1*5*f+t*1.2)*.28*d;
                x1+=Math.sin(y1*2*f-t)*.12*d;
            }else if(params.style==="waves"){
                y1+=Math.sin(x1*4*f+t)*.30*d;
                y1+=Math.sin(x1*9*f-t*.6)*.08*d;
            }else if(params.style==="ribbon"){
                y1+=Math.sin(x1*7*f+t*1.3)*.24*d;
                y1+=Math.sin(x1*15*f-t)*.08*d;
            }else if(params.style==="aurora"){
                x1+=Math.sin(y1*4*f-t)*.30*d;
                y1+=Math.sin(x1*2*f+t)*.12*d;
            }else if(params.style==="vortex"){
                const r=Math.sqrt(x1*x1+y1*y1);
                const a=Math.atan2(y1,x1)+r*1.7*d+t*.35;
                x1=Math.cos(a)*r;
                y1=Math.sin(a)*r;
            }else if(params.style==="spiral"){
                const r=Math.sqrt(x1*x1+y1*y1);
                const a=Math.atan2(y1,x1)+r*2*d+t*.25;
                x1=Math.cos(a)*r;
                y1=Math.sin(a)*r;
            }else if(params.style==="warp"){
                x1+=Math.sin(y1*5+t)*.18*d;
                y1+=Math.cos(x1*4-t)*.18*d;
            }else if(params.style==="organic"){
                x1+=Math.sin(y1*3+t)*.25*d;
                y1+=Math.cos(x1*3-t*.7)*.20*d;
            }else if(params.style==="marble"){
                const n=fbm(x1*1.5,y1*1.5+t*.05);
                x1+=n*.45*d;
                y1+=n*.25*d;
            }else if(params.style==="water"){
                x1+=Math.sin(y1*8+t)*.08*d;
                y1+=Math.sin(x1*10-t*.7)*.06*d;
            }else if(params.style==="folds"){
                y1+=Math.sin(x1*5+t)*.20*d;
                y1+=Math.sin(x1*11+t*.5)*.07*d;
            }else if(params.style==="energy"){
                x1+=Math.sin(y1*8-t)*.16*d;
                y1+=Math.cos(x1*6+t)*.12*d;
            }

            const r=Math.sqrt(x1*x1+y1*y1);
            const a=Math.atan2(y1,x1);

            let value;

            if(params.style==="smoke"||params.style==="clouds"||params.style==="nebula"){
                value=fbm(x1*f*.75+t*.06,y1*f*.75-t*.04);
            }else if(params.style==="noise"){
                value=fbm(x1*f*1.8+t*.03,y1*f*1.8);
            }else if(params.style==="lava"){
                value=Math.sin((x1+fbm(x1*1.5,y1*1.5)*1.8)*f*3+t*.6)*.5+.5;
            }else if(params.style==="sand"){
                value=fbm(x1*f*2,y1*f*2)*.7+.3;
            }else if(params.style==="topographic"){
                value=Math.sin(r*f*10-t*.3)*.5+.5;
            }else if(params.style==="grid"){
                const gx=Math.abs(Math.sin(x1*f*5));
                const gy=Math.abs(Math.sin(y1*f*5));
                value=Math.max(gx,gy);
            }else if(params.style==="lines"){
                value=Math.sin((x1+Math.sin(y1*3+t)*d)*f*10)*.5+.5;
            }else if(params.style==="rings"){
                value=Math.sin(r*f*11-t*1.2)*.5+.5;
            }else if(params.style==="tunnel"){
                value=Math.sin(a*7+Math.log(Math.max(r,.02))*f*5+t)*.5+.5;
            }else if(params.style==="plasma"){
                value=.5+
                    .22*Math.sin(x1*f*3+t)+
                    .22*Math.sin(y1*f*4-t*.8)+
                    .12*Math.sin((x1+y1)*5+t*.5);
            }else if(params.style==="cosmic"){
                value=.5+.5*Math.sin(r*f*8-t);
            }else if(params.style==="bokeh"){
                const q=fbm(x1*1.5,y1*1.5+t*.04);
                value=Math.pow(q,1.8);
            }else if(params.style==="sunset"){
                value=clamp(.5-v0*.35+Math.sin(x1*2+t*.15)*.08);
            }else if(params.style==="particles"){
                value=.5+.5*Math.sin(x1*f*7+y1*f*5+t*1.5+fbm(x1,y1)*3);
            }else if(params.style==="energy"){
                value=.5+.5*Math.sin((x1+y1*.4)*f*8+t);
            }else{
                value=.5+
                    .25*Math.sin(x1*f*2.4+t)+
                    .25*Math.cos(y1*f*2.1-t*.8);
            }

            value=clamp(value);
            let rgb=palette(value,colors);

            const lum=.299*rgb[0]+.587*rgb[1]+.114*rgb[2];
            rgb[0]=lum+(rgb[0]-lum)*params.saturation;
            rgb[1]=lum+(rgb[1]-lum)*params.saturation;
            rgb[2]=lum+(rgb[2]-lum)*params.saturation;

            rgb[0]=(rgb[0]-.5)*params.contrast+.5;
            rgb[1]=(rgb[1]-.5)*params.contrast+.5;
            rgb[2]=(rgb[2]-.5)*params.contrast+.5;

            rgb[0]*=params.brightness;
            rgb[1]*=params.brightness;
            rgb[2]*=params.brightness;

            if(params.glow>0){
                const g=Math.max(0,1-r*.8)*params.glow*.12;
                rgb[0]+=g;rgb[1]+=g;rgb[2]+=g;
            }

            if(params.vignette>0){
                const vv=1-Math.min(1,r)*params.vignette;
                rgb[0]*=vv;rgb[1]*=vv;rgb[2]*=vv;
            }

            if(params.grain>0){
                const gr=(hash(x*.03,y*.03,params.seed+t*10)-.5)*params.grain;
                rgb[0]+=gr;rgb[1]+=gr;rgb[2]+=gr;
            }

            data[p++]=clamp(rgb[0])*255;
            data[p++]=clamp(rgb[1])*255;
            data[p++]=clamp(rgb[2])*255;
            data[p++]=255;
        }
    }

    ctx.putImageData(image,0,0);
    requestAnimationFrame(render);
}

function bindRange(id,key,val){
    const e=document.getElementById(id);
    e.addEventListener("input",()=>{
        params[key]=parseFloat(e.value);
        document.getElementById(val).textContent=params[key].toFixed(2);
    });
}

bindRange("speed","speed","speedVal");
bindRange("scale","scale","scaleVal");
bindRange("distortion","distortion","distortionVal");
bindRange("frequency","frequency","frequencyVal");
bindRange("rotation","rotation","rotationVal");
bindRange("brightness","brightness","brightnessVal");
bindRange("saturation","saturation","saturationVal");
bindRange("contrast","contrast","contrastVal");
bindRange("softness","softness","softnessVal");
bindRange("glow","glow","glowVal");
bindRange("grain","grain","grainVal");
bindRange("vignette","vignette","vignetteVal");

document.querySelectorAll(".color").forEach(e=>{
    e.addEventListener("input",()=>{});
});

document.getElementById("colorCount").addEventListener("input",e=>{
    params.colorCount=parseInt(e.value);
    document.getElementById("colorCountVal").textContent=params.colorCount;
});

document.getElementById("style").addEventListener("change",e=>{
    params.style=e.target.value;
    document.getElementById("status").textContent="60 FPS • "+e.target.value;
});

let playing=true;
let startTime=performance.now();

document.getElementById("pause").addEventListener("click",()=>{
    playing=!playing;
    document.getElementById("pause").textContent=playing?"Ⅱ Pause":"▶ Resume";
    if(playing)startTime=performance.now();
});

function randomHex(){
    return "#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0");
}

function randomize(){
    params.style=styleNames[Math.floor(Math.random()*styleNames.length)];
    params.speed=.25+Math.random()*.9;
    params.scale=.55+Math.random()*1.5;
    params.distortion=.1+Math.random()*1.5;
    params.frequency=.7+Math.random()*4.5;
    params.rotation=-3.14+Math.random()*6.28;
    params.brightness=.85+Math.random()*.35;
    params.saturation=.75+Math.random()*1.0;
    params.contrast=.8+Math.random()*.45;
    params.softness=.25+Math.random()*.7;
    params.glow=Math.random()*.7;
    params.grain=Math.random()*.02;
    params.vignette=Math.random()*.35;
    params.colorCount=2+Math.floor(Math.random()*5);
    params.seed=Math.floor(Math.random()*999999999);

    document.getElementById("style").value=params.style;
    document.getElementById("seed").value=params.seed;

    for(let i=1;i<=6;i++){
        document.getElementById("c"+i).value=randomHex();
    }

    syncUI();
    startTime=performance.now();
}

function syncUI(){
    const ids=["speed","scale","distortion","frequency","rotation","brightness","saturation","contrast","softness","glow","grain","vignette"];
    ids.forEach(id=>{
        document.getElementById(id).value=params[id];
        document.getElementById(id+"Val").textContent=params[id].toFixed(2);
    });
    document.getElementById("colorCount").value=params.colorCount;
    document.getElementById("colorCountVal").textContent=params.colorCount;
}

document.getElementById("random").addEventListener("click",randomize);
document.getElementById("random2").addEventListener("click",randomize);

document.getElementById("applySeed").addEventListener("click",()=>{
    params.seed=parseInt(document.getElementById("seed").value)||1;
    startTime=performance.now();
});

document.getElementById("quality").addEventListener("change",e=>{
    if(e.target.value==="720"){
        canvas.width=960;canvas.height=540;
        document.getElementById("info").textContent="960 × 540 • GPU • Smooth";
    }else{
        canvas.width=1280;canvas.height=720;
        document.getElementById("info").textContent="1280 × 720 • GPU • High";
    }
    startTime=performance.now();
});

syncUI();
requestAnimationFrame(render);
</script>


</body>
</html>
